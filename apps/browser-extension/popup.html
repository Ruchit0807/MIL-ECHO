<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MIL ECHO - Viral Spiral Scraper</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #090c15;
      color: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .header h2 {
      font-size: 16px;
      margin: 0;
      color: #00f2fe;
    }
    .card-box {
      background: rgba(18, 24, 41, 0.9);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🚀 MIL ECHO Scraper</h2>
  </div>

  <div class="status-badge" id="statusBadge">Checking AI Service...</div>

  <div class="card-box">
    <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Captured Deck Inbox</div>
    <div style="font-size: 24px; font-weight: bold; color: #fff;" id="deckCount">0 Cards</div>
    <p style="font-size: 11px; color: #94a3b8; margin-top: 6px;">
      Highlight text on any site, right-click, and select "Send to Viral Spiral Deck".
    </p>
  </div>

  <button class="btn" id="openArenaBtn">Open Web Client Arena</button>

  <script src="popup.js"></script>
</body>
</html>
